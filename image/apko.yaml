# Wolfi distroless runtime for gitlab-compliance.
# Tool image digests (see scripts/build-image.sh) and this directory's apko
# lockfile are the pins to update — Dependabot docker only bumps Dockerfile
# FROM lines, which this image build no longer uses.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  build_repositories:
    - "@local ./packages"
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - python-3.14
    - gitlab-compliance@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

work-dir: /gitlab-compliance

environment:
  PATH: /usr/share/gitlab-compliance/venv/bin:/usr/bin:/bin
  LANG: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

entrypoint:
  command: /usr/bin/gitlab-compliance

cmd: --help

annotations:
  org.opencontainers.image.title: gitlab-compliance
  org.opencontainers.image.description: BDD compliance testing for GitLab CI/CD — by MaturityBuilder
  org.opencontainers.image.source: https://github.com/MaturityBuilder/gitlab-compliance
  org.opencontainers.image.vendor: MaturityBuilder
  org.opencontainers.image.url: https://maturitybuilder.github.io/gitlab-compliance/
  org.opencontainers.image.licenses: Apache-2.0
