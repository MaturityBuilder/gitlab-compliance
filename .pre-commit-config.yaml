repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files
    - id: check-merge-conflict
    - id: check-ast
    - id: double-quote-string-fixer
    - id: debug-statements
    - id: check-toml
    - id: check-json
    - id: check-xml
  - repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
    - id: black
