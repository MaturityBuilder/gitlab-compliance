site_name: gitlab-compliance
site_description: BDD compliance testing for GitLab CI/CD pipelines and project settings — by MaturityBuilder
copyright: Copyright &copy; MaturityBuilder
docs_dir: docs
site_dir: public
repo_url: https://github.com/MaturityBuilder/gitlab-compliance
repo_name: MaturityBuilder/gitlab-compliance
edit_uri: edit/main/
theme:
  variant: modern
  custom_dir: overrides
  logo: assets/logo-square.png
  favicon: assets/favicon.png
  language: en
  font:
    text: DM Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Overview: index.md
  - Installation:
    - installation/index.md
    - Installing via pip: installation/pip.md
    - Installing via Docker: installation/docker.md
  - Command Reference:
    - Overview: usage/reference/command-reference.md
    - Compliance:
      - Check: usage/reference/check.md
      - Policies:
          - Overview: usage/reference/policies.md
          - Policy Catalog: usage/reference/policies-doc.md
          - Pull: usage/reference/policies-pull.md
          - Push: usage/reference/policies-push.md
      - Environment Variables: usage/environment-variables.md
    - Generate Documentation:
      - Generate Pipeline Documentation: usage/reference/generate.md
      - Generate HTML Documentation: usage/reference/generate-html.md
      - Get Specific Documentation About Attributes: usage/reference/get-attributes.md
    - Release Notes Commands:
      - Release Notes: usage/reference/release-notes.md
    - Update Command Reference: usage/reference/dumps.md
  - Usage:
    - usage/index.md
    - Additional Parameters: usage/additional-parameters.md


  - BDD Reference:
    - bdd-reference/index.md
    - Overview of Scenario Flow: bdd-reference/overview.md
    - Advanced scenarios: bdd-reference/advanced-scenarios.md
    - Scenario Outline deep-dive: bdd-reference/scenario-outline.md
    - GIVEN Directives: bdd-reference/given.md
    - WHEN Directives: bdd-reference/when.md
    - THEN Directives: bdd-reference/then.md
    - Using AND: bdd-reference/using-and.md
    - Policy Metadata: bdd-reference/metadata.md
  - Examples:
    - Compliance Examples:
      - examples/index.md
      - Advanced scenarios: examples/advanced-scenarios.md
      - Image Pinning: examples/image-pinning.md
      - Component Pinning: examples/component-pinning.md
      - Fragment Pinning: examples/fragment-pinning.md
      - Include Versions: examples/include-versions.md
      - Service Pinning: examples/service-pinning.md
      - Execution Policy: examples/execution-policy.md
      - Template Extends: examples/template-extends.md
      - API Hardening: examples/api-hardening.md
      - Rules Policy: examples/rules.md
      - OCI Policy Packs: examples/oci-policy-packs.md
      - Compliance Security Examples: examples/compliance-security-examples.md

    - Gitlab Docs Output (generate command): examples/gitlab-docs-output-example.md
  - Using in CI/CD:
    - ci-cd/index.md
    - GitLab CI/CD: ci-cd/gitlab-ci.md
    - GitHub Actions: ci-cd/github-actions.md
    - Pipeline Execution Policy: ci-cd/pipeline-execution-policy.md
  - Contributing:
    - contributing.md
    - Site build & publish: site-documentation.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
      toc_depth: 4

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  homepage: /
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MaturityBuilder/gitlab-compliance
