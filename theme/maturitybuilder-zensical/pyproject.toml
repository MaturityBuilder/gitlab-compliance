[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maturitybuilder-zensical-theme"
version = "0.1.0"
description = "Modern MaturityBuilder theme for Zensical documentation sites"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "zensical>=0.0.47",
]
keywords = [
    "documentation",
    "maturitybuilder",
    "mkdocs",
    "theme",
    "zensical",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
]

[project.urls]
Homepage = "https://github.com/MaturityBuilder/gitlab-compliance"
Repository = "https://github.com/MaturityBuilder/gitlab-compliance"
Documentation = "https://github.com/MaturityBuilder/gitlab-compliance/tree/main/theme/maturitybuilder-zensical"

[project.entry-points."mkdocs.themes"]
maturitybuilder = "maturitybuilder_zensical"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maturitybuilder_zensical = [
    "mkdocs_theme.yml",
    "main.html",
    "assets/**/*",
    "partials/**/*",
]
