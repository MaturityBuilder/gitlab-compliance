version: "3.9"

services:
  gitlab-docs-alpine:
    build:
      context: .
      dockerfile: Dockerfile.alpine
      target: alpine
    image: gitlab-docs:alpine
    container_name: gitlab-docs-alpine
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    command: ["gitlab-docs", "--help"]

  gitlab-docs-debian:
    build:
      context: .
      dockerfile: Dockerfile.alpine
      target: debian
    image: gitlab-docs:debian
    container_name: gitlab-docs-debian
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    command: ["gitlab-docs", "--help"]
