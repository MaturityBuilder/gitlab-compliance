# Complex compliant pipeline: anchors, extends, hidden jobs, all GLCI-BUILTIN-SHELL pass patterns.
stages:
  - prepare
  - build
  - verify

variables: &shared_vars
  APP_NAME: shell-demo
  CACHE_ROOT: /var/cache/app

.pinned_apk: &pinned_apk "apk add --no-cache jq=1.7.1-r0 bash=5.2.21-r0"
.pinned_pip: &pinned_pip "pip install \"requests==2.32.0\""
.quoted_ci_echo: &quoted_ci_echo "echo \"commit=${CI_COMMIT_SHA}\""

.helper_echo:
  script:
    - echo "helper ready"

.base_job: &base_job
  variables: *shared_vars
  before_script:
    - set -euo pipefail
    - !reference [.helper_echo, script]

.install_alpine:
  <<: *base_job
  script:
    - set -euo pipefail
    - *pinned_apk
    - *quoted_ci_echo

.install_debian:
  <<: *base_job
  script:
    - set -euo pipefail
    - apt-get update
    - apt-get install -y ca-certificates=20230311 git=1:2.39.2-1.1
    - apt install --no-install-recommends tree=2.1.0-1

.install_rpm:
  <<: *base_job
  script:
    - set -euo pipefail
    - yum install -y httpd-2.4.57-1.el9
    - dnf install -y jq-1.6-15.el9
    - microdnf install -y tar-1.34-6.el9.x86_64

.install_lang:
  <<: *base_job
  script:
    - set -euo pipefail
    - *pinned_pip
    - pip3 install -q "PyYAML==6.0.2"
    - npm install -g "typescript@5.4.5"
    - yarn global add "lodash@4.17.21"
    - go install golang.org/x/tools/cmd/goimports@v0.21.0

.safe_shell_hygiene:
  <<: *base_job
  script:
    - |
      #!/usr/bin/env bash
      set -euo pipefail
      cd "$HOME"
      value="$(echo hi)"
      nested="$(echo "$(date +%F)")"
      # Nested quotes inside "$(...)" are valid POSIX/bash (independent quote context).
      check="$(echo "$HOSTNAME" | tr '[:lower:]' '[:upper:]')"
      echo "${APP_NAME:-shell-demo}"
      echo \$LITERAL
      tmp="$(mktemp)"
      echo "ok" >"$tmp"
      rm -rf "$CACHE_ROOT"
      printf '%s\n' "${items[@]}"
      if [ "$CI_COMMIT_SHA" = "abc" ]; then echo ok; fi
      echo a | grep -q a
      curl -fsSL "https://example.com/file.tgz" -o /tmp/file.tgz
      echo "deadbeef  /tmp/file.tgz" | sha256sum -c -
      git clone "https://example.com/repo.git"
      git checkout "v1.2.3"
      docker pull python:3.12.0
      docker run --rm -v "$PWD:/work" -w /work python:3.12.0 python --version
      docker run --rm python@sha256:66d292e5c26bd33a6f6f61cacb880de2186339a524ecba1ce098dbbaceed6515 --help
      greet() { echo "hi"; }
      greet

prepare:alpine:
  stage: prepare
  extends:
    - .install_alpine

prepare:debian:
  stage: prepare
  extends:
    - .install_debian

prepare:rpm:
  stage: prepare
  extends:
    - .install_rpm

build:lang:
  stage: build
  extends:
    - .install_lang

verify:hygiene:
  stage: verify
  extends:
    - .safe_shell_hygiene
