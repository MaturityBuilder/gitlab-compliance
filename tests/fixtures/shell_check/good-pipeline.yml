stages:
  - test

.safe-template:
  script:
    - set -euo pipefail
    - echo "hello"
    - curl -fsSL "https://example.com/file.tgz" -o /tmp/file.tgz
    - echo "abc123  /tmp/file.tgz" | sha256sum -c -
    - apk add --no-cache curl=8.5.0-r0
    - pip install "requests==2.32.0"
    - value="$(echo hi)"
    - cd "$HOME"
    - if [ "$CI_COMMIT_SHA" = "abc" ]; then echo ok; fi

safe-job:
  stage: test
  extends:
    - .safe-template
  script:
    - printf '%s\n' "${items[@]}"
