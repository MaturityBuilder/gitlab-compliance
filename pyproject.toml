[project]
name = "gitlab-compliance"
version = "2.3.0"
dynamic = [ "readme" ]
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
[project.urls]
"Home Page" = "https://maturitybuilder.github.io/gitlab-compliance/"
DOCUMENTATION = "https://maturitybuilder.github.io/gitlab-compliance/"
Repository = "https://github.com/MaturityBuilder/gitlab-compliance"

[tool.poetry_bumpversion.file."src/__init__.py"]

[tool.poetry]
name = "gitlab-compliance"
description = "BDD compliance testing for GitLab CI/CD pipelines and project settings — by MaturityBuilder"
authors = ["Charlie Smith <me@charlieasmith.co.uk>"]
license = "Apache-2.0"
readme = ["docs/index.md"]

packages = [{ include = "src" }]



[tool.poetry.dependencies]
python = ">=3.12"
prettytable = "*"
pytablewriter = "1.2.1"
oyaml = "*"
typer = "0.27.0"
markdown-analysis = "0.1.5"
urllib3 = "2.7.0"
jq = "1.12.0"
click = "^8.1.8"
semver = "3.0.4"
pyyaml = "6.0.3"
loguru = "0.7.2"
python-gitlab = "8.4.0"
rich = "15.0.0"
oras = "0.2.42"
idna = "3.18"
requests = "2.34.2"
behave = "^1.2.6"

[tool.poetry.scripts]
gitlab-docs = 'src.gitlab_compliance:gitlab_compliance'
gitlab-compliance = 'src.gitlab_compliance:gitlab_compliance'

[tool.poetry.group.dev.dependencies]
setuptools = "83.0.0"
pytest = "^9.0.3"
pre-commit = "^4.6.1"
pyyaml = "^6.0.3"
coverage = "^7.9.2"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.poetry.group.docs.dependencies]
zensical = "^0.0.51"
[build-system]
requires = ["poetry-core","setuptools","poetry-bumpversion","id"]
build-backend = "poetry.core.masonry.api"
