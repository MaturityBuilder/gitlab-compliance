[tool.poetry_bumpversion.file."gitlab-docs/__init__.py"]
[tool.poetry]
name = "gitlab-docs"
version = "0.0.36"
description = "A tool that automatically generates gitlab documentation from yaml files"
authors = ["Charlie Smith <me@charlieasmith.co.uk>"]
readme = "GITLAB-DOCS.md"
packages = [{include = "gitlab_docs", format = "sdist"}]

[tool.poetry.dependencies]
python = "^3.7"
prettytable = "*"
pytablewriter = "~1.2.0"
oyaml = "*"
typer = "^0.12.5"
markdown-analysis = "*"
setuptools = "*"


[tool.poetry.scripts]
gitlab-docs = 'gitlab_docs.app:main'

[build-system]
requires = ["poetry-core","setuptools","poetry-bumpversion"]
build-backend = "poetry.core.masonry.api"
