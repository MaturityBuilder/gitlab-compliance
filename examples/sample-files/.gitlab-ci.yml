---
spec:
  inputs:
    runner-profile:
      default: docker
      description: |
        Sample input documenting how component consumers override runner settings.
        Used by gitlab-compliance `generate` and `document gitstrings` examples.
---
include:
  - "gitlab-ci/includes_without_keys.yml"

  - local: "gitlab-ci/includes_with_keys.yml"
    variables:
      MY_VARIABLE: "true"
    rules:
      - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  - component: https://gitlab.com/charlieasmith/gitlab-docs@main
    inputs:
      MY_INPUTS: "true"
    rules:
      - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  - project: "charlieasmith/a-generic-fragment"
    ref: main
    file: "a-fragment-file.yml"
    variables:
      MY_VARIABLE: "true"
    rules:
      - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
default:
  tags:
    - ${DEV_IAM_RUNNER}
# Documented variables for compliance and documentation tooling (see table_render / generate).
variables:
  RUNNER:
    value: docker
    description: |
      Runner implementation label for sample jobs.
      Shown in generated variable tables when documenting this file.
workflow:
  - if: $CI_COMMIT_REF_NAME == "main"
  - if: $CI_COMMIT_TAG
  - when: never

stages:
  - code-quality
  - build
  - deploy

# --- Code quality (extends shared org templates) ---

fragment-version-check:
  stage: code-quality
  extends:
    - .fragment-version-check-template

gitleaks:
  stage: code-quality
  extends:
    - .gitleaks-template

shell-check:
  stage: code-quality
  extends:
    - .shell-check-template
  allow_failure: true

todo-check:
  stage: code-quality
  extends:
    - .todo-check-template

# --- Build / deploy (docker + ECR sample) ---

.docker.build:
  image: docker
  services:
    - docker:24.0.5-dind
    - !reference [.inject-aws-credentials-apk-based-os, script]
  variables:
    DOCKER_BUILDKIT: 1
    DOCKER_DRIVER: overlay2
    ECR_URL: some_aws_account_number.dkr.ecr.eu-west-2.amazonaws.com
  script:
    - |
      aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin ${ECR_URL}
      docker-compose build

build:
  stage: build
  extends:
    - .docker.build

publish:
  stage: deploy
  extends:
    - .docker.build
  after_script:
    - |
      echo "My Script"
