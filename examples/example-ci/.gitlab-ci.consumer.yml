# Minimal consumer project: copy policies locally and extend shared compliance jobs.
#
#   cp -r examples/example-policies/security/ policies/security/
#   cp example-ci/.gitlab-ci.consumer.yml .gitlab-ci.yml

stages:
  - test
  - build

include:
  - local: example-ci/compliance-jobs.yml

compliance:
  extends: .compliance:offline

build:
  stage: build
  image: alpine:3.20
  script:
    - echo "application build"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
