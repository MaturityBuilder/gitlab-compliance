include:
  - local: "gitlab-ci/includes.yml"
  - "gitlab-ci/includes.yml"
  - component: https://gitlab.com/charlieasmith/gitlab-docs@main
  - project: 'charlieasmith/a-generic-fragment'
    ref: main
    file: 'a-fragment-file.yml'
default:
  tags:
    - ${DEV_IAM_RUNNER}
variables:
  RUNNER: docker
workflow:
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_TAG
    - when: never

stages:
  - code-quality
  - build
  - deploy

fragment-version-check:
  stage: code-quality
  extends:
    - .fragment-version-check-template

gitleaks:
  stage: code-quality
  extends:
    - .gitleaks-template

shell-check:
  stage: code-quality
  extends:
    - .shell-check-template
  allow_failure: true

todo-check:
  stage: code-quality
  extends:
    - .todo-check-template

.docker.build:
  image: docker
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_BUILDKIT: 1
    DOCKER_DRIVER: overlay2
    ECR_URL: some_aws_account_number.dkr.ecr.eu-west-2.amazonaws.com
  script:
    # - !reference [.inject-aws-credentials-apk-based-os, script]
    - |
      aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin ${ECR_URL}
      docker-compose build

build:
  stage: build
  extends:
    - .docker.build

publish:
  stage: deploy
  extends:
    - .docker.build
  after_script:
    - |
      echo "My Script"