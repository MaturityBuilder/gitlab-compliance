---
stages:
  - code-quality
  - build
  - test
  - publish

variables:
  APPLICATION: gitlab-docs
  OUTPUT_FILE: README.md
image: python:3.12
default:
  tags:
    - gitlab-org

megalinter:
  stage: code-quality
  image: oxsecurity/megalinter-python:v8.0.0
  script: ["true"] # if script: ["true"] doesn't work, you may try ->  script: [ "/bin/bash /entrypoint.sh" ]
  variables:
    # All available variables are described in documentation
    # https://megalinter.io/configuration/
    DEFAULT_WORKSPACE: $CI_PROJECT_DIR
    # ADD YOUR CUSTOM ENV VARIABLES HERE TO OVERRIDE VALUES OF .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY
  artifacts:
    when: always
    paths:
      - megalinter-reports
    expire_in: 1 week

build:python:
  stage: .pre
  needs: []
  environment: release
  id_tokens:
    PYPI_ID_TOKEN:
      # testpypi
      aud: pypi
      # id-token: write
  # before_script:
  script:
    # install poetry for managing application
    - curl -sSL "https://install.python-poetry.org" | python3 -
    - export PATH="/root/.local/bin:$PATH"
    - poetry --version
    - poetry install
    # - poetry config.repositories.test-pypi https://test.pypi.org
    - poetry build
    # - latest_build=$(ls ./dist/*.tar.gz)
    - pip3 install -q $(ls ./dist/*.tar.gz)
    - gitlab-docs
    # Authentication using OIDC
    # Replace "https://pypi.org/*" with "https://test.pypi.org/*" if uploading to TestPyPI
    - |
      pip3 install -q id jq
      oidc_token=$(python -m id PYPI)
      resp=$(curl -X POST https://pypi.org/_/oidc/mint-token -d "{\"token\":\"${oidc_token}\"}")
      api_token=$(jq --raw-output '.token' <<< "${resp}")
      poetry config http-basic.pypi __token__ "${api_token}"
      poetry publish

docker-build-master:
  # Official docker image.
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE" .
    - docker push "$CI_REGISTRY_IMAGE"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_COMMIT_TAG || $CI_COMMIT_REF_NAME == "f-code-for-includes-docs"

build:docker:
  # Official docker image.
  needs: []
  tags:
    - gitlab-org-docker
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_COMMIT_TAG || $CI_COMMIT_REF_NAME == "f-code-for-includes-docs"
