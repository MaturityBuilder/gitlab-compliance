docker-build:
  # Official docker image.
  # dependencies:
  #   - build
  image: docker:latest
  stage: build
  tags:
    - gitlab-org-docker
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker run -v $PWD:/gitlab-docs "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_COMMIT_TAG
