---
# @title Pipeline inputs
# @description
#   CI component inputs for this repository.
#   Regenerate tables: gitlab-compliance document gitstrings -i .gitlab-ci.yml
# @render inputs
# @output README.md
spec:
  inputs:
    job-stage:
      default: test
      description: |
        Default stage for jobs that extend `.test:rules` in this pipeline.
        Override at include time when consuming this configuration as a component.
---
stages:
  - test
  - build
  - publish
include:
  - local: gitlab-ci/hidden.jobs.yml
  - project: charlieasmith/cas-cli
    ref: 0.0.1
    file: gitlab-include-sample.yml
  - component: https://gitlab.com/charlieasmith/gitlab-docs@1.0.6
    inputs:
      MY_INPUTS: "true"
    rules:
      - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  - component: https://gitlab.com/charlieasmith/gitlab-docs@1.0.6
    inputs:
      MY_INPUTS: "true"
    rules:
      - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
# @title Project variables
# @description
#   Top-level variables for docs generation and packaging jobs.
# @render variables
# @output README.md
variables:
  APPLICATION:
    value: gitlab-docs
    description: |
      Published package and documentation product name for generate/gitstrings output.
  OUTPUT_FILE:
    value: GITLAB-DOCS.md
    description: |
      Default markdown path targeted by pipeline documentation jobs.
  # CI_REGISTRY: registry.gitlab.com
image:
  name: charlieasmith93/poetry-python3:3.12.12-1.8.3-dev
default:
  tags:
    - gitlab-docs
.test:rules:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
# .poetry:install:
  # before_script:
  #   # install poetry for managing application
  #   - apt-get update -qy
  #   - apt-get install -qy curl git
  #   - curl -sSL "https://install.python-poetry.org" | python3 -
  #   - export PATH="/root/.local/bin:$PATH"
  #   - poetry --version
  #   - poetry install
workflow:
  rules:
    - if: "$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore: bumping version to/"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_NAME == $CI_COMMIT_TAG

megalinter:
  image: oxsecurity/megalinter-ci_light@sha256:54e221da51b3fb959dfd4fc5e21920e0a0fa339ba68e0e9162b894a01a52ed34
  # extends: [".mr_rules"]
  script: ["true"] # if script: ["true"] doesn't work, you may try ->  script: [ "/bin/bash /entrypoint.sh" ]
  variables:
    # All available variables are described in documentation
    # https://megalinter.io/configuration/
    DEFAULT_WORKSPACE: $CI_PROJECT_DIR
    # ADD YOUR CUSTOM ENV VARIABLES HERE TO OVERRIDE VALUES OF .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY
  artifacts:
    when: always
    paths:
      - megalinter-reports
    expire_in: 1 week
  allow_failure: true
  extends:
    - .test:rules
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != $CI_COMMIT_TAG

behave-tests:
  variables:
    POETRY_VIRTUALENVS_CREATE: "false"
  before_script:
    - poetry install
  extends:
    - .test:rules
    # - .poetry:install
  script:
    - poetry run coverage erase
    - poetry run coverage run -m behave
    - poetry run coverage run -a -m pytest tests/ -v
    - poetry run coverage report -m
    - poetry run coverage report --fail-under 95

bump-version:
  stage: publish
  image: python@sha256:c1a5d356638cc86bd865d9019efbc34a6b0c3ad15a21e5ab4eb57bd2d1c3f7ce
  before_script:
    - pip install conventional-commit versioningit
    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "GitLab CI Bot"
  script:
    # Get the latest tag / version from Poetry
    - |
      CURRENT_VERSION=$(poetry version -s)
      echo "Current version: $CURRENT_VERSION"

      # Get recent commits (since the last tag)
      COMMITS=$(git log -1 --pretty=%B)
      echo "Last commit message: $COMMITS"

    # Determine bump type based on Conventional Commit rules
    - |
      if echo "$COMMITS" | grep -q "BREAKING CHANGE"; then
        BUMP="major"
      elif echo "$COMMITS" | grep -Eiq "^feat(\(.*\))?: "; then
        BUMP="minor"
      elif echo "$COMMITS" | grep -Eiq "^fix(\(.*\))?: "; then
        BUMP="patch"
      else
        echo "No conventional commit keyword found; skipping version bump."
        exit 0
      fi
      echo "Detected bump type: $BUMP"

      # Bump version with Poetry
      poetry version $BUMP
      NEW_VERSION=$(poetry version -s)
      echo "__version__ = \"$NEW_VERSION\"" > src/__init__.py
      echo "Bumped version: $NEW_VERSION"

      git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com".insteadOf "https://gitlab.com"
      git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com".insteadOf "git@gitlab.com"
      git add pyproject.toml src/__init__.py
      git commit -m "chore: bumping version to $NEW_VERSION"
    - git tag "$NEW_VERSION"
    - git push origin HEAD:$CI_COMMIT_REF_NAME
    - git push origin "$NEW_VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

.build:python:
  needs: []
  stage: build
  environment: release
  # extends:
    # - .poetry:install
  script:
    - poetry build
    - pip3 install -q $(ls ./dist/*.tar.gz)
    - gitlab-docs

test-build:
  extends:
    - .build:python
    - .test:rules

.docs:zensical:
  before_script:
    - pip install -q "zensical>=0.0.47"
  script:
    - zensical build --strict

docs:review:
  extends:
    - .docs:zensical
    - .test:rules
  stage: build
  artifacts:
    paths:
      - public
    expire_in: 1 week

pages:
  extends: .docs:zensical
  stage: publish
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:
  cache: []
  # extends:
  #   - .poetry:install
  stage: publish
  environment: release
  script:
    - poetry publish --build
  rules:
    - if: $CI_COMMIT_TAG

docker-build:
  image: docker@sha256:66d292e5c26bd33a6f6f61cacb880de2186339a524ecba1ce098dbbaceed6515
  stage: build
  tags:
    - gitlab-org-docker
  services:
    - docker@sha256:66d292e5c26bd33a6f6f61cacb880de2186339a524ecba1ce098dbbaceed6515
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker run -v $PWD:/gitlab-docs "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_COMMIT_TAG
    # || $CI_COMMIT_REF_NAME == "f-code-for-includes-docs"
