---
spec:
  inputs:
    job-stage:
      default: test
    environment:
      default: production
---
stages:
  - test
  - build
  - publish
include:
  - local: gitlab-ci/hidden.jobs.yml
variables:
  APPLICATION: gitlab-docs
  OUTPUT_FILE: GITLAB-DOCS.md
  # CI_REGISTRY: registry.gitlab.com
image: python:3.12.11
default:
  tags:
    - gitlab-org
.test:rules:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
.poetry:install:
  before_script:
    # install poetry for managing application
    - curl -sSL "https://install.python-poetry.org" | python3 -
    - export PATH="/root/.local/bin:$PATH"
    - poetry --version
    - poetry install -q
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_REF_NAME == $CI_COMMIT_TAG

megalinter:
  image: oxsecurity/megalinter-ci_light
  # extends: [".mr_rules"]
  script: ["true"] # if script: ["true"] doesn't work, you may try ->  script: [ "/bin/bash /entrypoint.sh" ]
  variables:
    # All available variables are described in documentation
    # https://megalinter.io/configuration/
    DEFAULT_WORKSPACE: $CI_PROJECT_DIR
    # ADD YOUR CUSTOM ENV VARIABLES HERE TO OVERRIDE VALUES OF .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY
  artifacts:
    when: always
    paths:
      - megalinter-reports
    expire_in: 1 week
  allow_failure: true
  extends: 
    - .test:rules

behave-tests:
  variables:
    POETRY_VIRTUALENVS_CREATE: "false"
  before_script:
    - pip install poetry
    - poetry install
  extends: 
    - .test:rules
    - .poetry:install
  script:
    - poetry run coverage run -m behave
    - poetry run coverage report --fail-under 80

bump-version:
  stage: .post
  image: python:3.12.11
  before_script:
    - pip install poetry conventional-commit versioningit
    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "GitLab CI Bot"
  script:
    # Get the latest tag / version from Poetry
    - |
      CURRENT_VERSION=$(poetry version -s)
      echo "Current version: $CURRENT_VERSION"

      # Get recent commits (since the last tag)
      COMMITS=$(git log -1 --pretty=%B)
      echo "Last commit message: $COMMITS"

    # Determine bump type based on Conventional Commit rules
    - |
      if echo "$COMMITS" | grep -q "BREAKING CHANGE"; then
        BUMP="major"
      elif echo "$COMMITS" | grep -Eiq "^feat(\(.*\))?: "; then
        BUMP="minor"
      elif echo "$COMMITS" | grep -Eiq "^fix(\(.*\))?: "; then
        BUMP="patch"
      else
        echo "No conventional commit keyword found; skipping version bump."
        exit 0
      fi
      echo "Detected bump type: $BUMP"

      # Bump version with Poetry
      poetry version $BUMP
      NEW_VERSION=$(poetry version -s)
      echo "__version__ = \"$NEW_VERSION\"" > src/__init__.py
      echo "Bumped version: $NEW_VERSION"

      git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com".insteadOf "https://gitlab.com"
      git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com".insteadOf "git@gitlab.com"
      git add pyproject.toml src/__init__.py
      git commit -m "chore: bumping version to $NEW_VERSION"
    - git tag "$NEW_VERSION"
    - git push origin HEAD:$CI_COMMIT_REF_NAME --push-option="ci.skip"
    - git push origin "$NEW_VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

.build:python:
  needs: []
  stage: build
  environment: release
  extends:
    - .poetry:install
  artifacts:
    when: always
    paths:
      - ./dist/*.tar.gz
    expire_in: 1 hour
  script:
    - poetry build
    - pip3 install -q $(ls ./dist/*.tar.gz)
    - gitlab-docs

test-build:
  extends:
    - .build:python
publish:
  needs: []
  extends:
    - .poetry:install
  stage: publish
  script:
    - |
      apt update -qq -y
      apt install -qq -y jq
      poetry install -q
      poetry publish --build --repository pypi --username __token__ --password "$CI_JOB_JWT_V2"
  id_tokens:
    PYPI_JWT:
      aud: "https://pypi.org"


