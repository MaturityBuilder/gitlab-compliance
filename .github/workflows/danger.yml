name: Danger

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  danger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Danger
        uses: danger/python@v12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
