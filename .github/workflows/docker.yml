name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - poetry.lock
      - dockerfile
      - .github/workflows/docker.yml
  push:
    branches:
      - main
    tags:
      - "*"
# permissions:
#   contents: read
#   security-events: write
env:
  IMAGE_NAME: maturitybuilder/gitlab-compliance

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Dockerfile and context
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Scan built image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Scan built image (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true

      # - name: Upload Trivy SARIF to Security tab
      #   uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v3
      #   if: >-
      #     always() &&
      #     hashFiles('trivy-image.sarif') != '' &&
      #     (github.event_name != 'pull_request' ||
      #       github.event.pull_request.head.repo.full_name == github.repository)
      #   with:
      #     sarif_file: trivy-image.sarif
      #     category: trivy-image

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-image.sarif') != '' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 14

      - name: Smoke test CLI
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ github.sha }} --help
