name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - poetry.lock
      - image/**
      - scripts/build-image.sh
      - .melangeignore
      - .github/workflows/docker.yml
  push:
    branches:
      - main
    tags:
      - "*"
# permissions:
#   contents: read
#   security-events: write
env:
  IMAGE_NAME: maturitybuilder/gitlab-compliance

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build image (melange + apko)
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          LOAD_IMAGE: "1"
        run: bash scripts/build-image.sh

      - name: Scan image config and context
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Scan built image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Scan built image (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true

      # - name: Upload Trivy SARIF to Security tab
      #   uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v3
      #   if: >-
      #     always() &&
      #     hashFiles('trivy-image.sarif') != '' &&
      #     (github.event_name != 'pull_request' ||
      #       github.event.pull_request.head.repo.full_name == github.repository)
      #   with:
      #     sarif_file: trivy-image.sarif
      #     category: trivy-image

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-image.sarif') != '' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 14

      - name: Smoke test CLI
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ github.sha }} --help
