name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - poetry.lock
      - dockerfile
      - .github/workflows/docker.yml
  push:
    branches:
      - main
    tags:
      - "*"

env:
  IMAGE_NAME: maturitybuilder/gitlab-compliance

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Dockerfile and context
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Scan built image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Scan built image (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true

      # - name: Upload Trivy SARIF to Security tab
      #   uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v3
      #   if: >-
      #     always() &&
      #     hashFiles('trivy-image.sarif') != '' &&
      #     (github.event_name != 'pull_request' ||
      #       github.event.pull_request.head.repo.full_name == github.repository)
      #   with:
      #     sarif_file: trivy-image.sarif
      #     category: trivy-image

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-image.sarif') != '' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 14

      - name: Smoke test CLI
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ github.sha }} --help
