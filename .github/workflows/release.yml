name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

  id-token: write
  pull-requests: write
env:
  POETRY_VIRTUALENVS_CREATE: "false"
  POETRY_NO_INTERACTION: "1"
  IMAGE_NAME: maturitybuilder/gitlab-compliance

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release-please
      url: https://github.com/MaturityBuilder/gitlab-compliance/releases
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          release-type: python
          release-name: Release ${{ github.ref }}
          release-draft: false
          release-prerelease: false
          release-tag: ${{ github.ref }}
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: false

      - name: Cache Poetry dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests with coverage
        run: |
          poetry run coverage erase
          poetry run coverage run -m behave
          poetry run coverage run -a -m pytest tests/ -v

      - name: Coverage report
        run: poetry run coverage report -m

      - name: Check coverage threshold
        run: poetry run coverage report --fail-under 99

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: pypi
      url: https://pypi.org/p/gitlab-compliance
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: false

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  publish-docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: docker
      url: https://hub.docker.com/r/maturitybuilder/gitlab-compliance
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (melange + apko)
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          LOAD_IMAGE: "1"
        run: bash scripts/build-image.sh

      - name: Tag and push
        run: |
          set -euo pipefail
          SOURCE="${IMAGE_NAME}:${GITHUB_SHA}"
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            docker tag "${SOURCE}" "${tag}"
            docker push "${tag}"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Smoke test CLI
        run: docker run --rm ${{ env.IMAGE_NAME }}:latest --help

  # Triggered by the v* tag push, but only after PyPI publish succeeds.
  # The tap regenerates Formula/gitlab-compliance.rb from the PyPI package.
  publish-homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - name: Dispatch Homebrew formula update
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          gh api \
            --method POST \
            repos/MaturityBuilder/homebrew-gitlab-compliance/dispatches \
            -f event_type=gitlab-compliance-released \
            -f "client_payload[version]=${VERSION}"
          echo "Dispatched gitlab-compliance-released for PyPI version ${VERSION}"
