name: Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  POETRY_NO_INTERACTION: "1"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: poetry-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        run: poetry install --no-interaction


  pre-commit:
    needs: deps
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Restore Poetry virtualenv
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          fail-on-cache-miss: true

      - name: Run pre-commit
        run: SKIP=markdownlint-cli2 poetry run pre-commit run --all-files

  unit-test:
    needs: deps
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Restore Poetry virtualenv
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          fail-on-cache-miss: true

      - name: Run tests with coverage
        run: |
          poetry run coverage erase
          poetry run coverage run -m behave
          poetry run coverage run -a -m pytest tests/ -v

      - name: Coverage report
        run: poetry run coverage report -m

      - name: Check coverage threshold
        run: poetry run coverage report --fail-under 95

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: scorecard.sarif
          # results_format: sarif
          publish_results: true
          github-token: ${{ secrets.SCORECARD_TOKEN }}

      # - name: Upload SARIF Results
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: scorecard.sarif

      - name: Upload Scorecard Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 30
